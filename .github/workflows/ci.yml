name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref ao subir um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # mesma versão do Dockerfile (prod)
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instala dependências
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Testes (pytest)
        run: pytest -q

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"        # LTS; Vite 8 exige Node ^20.19 || >=22.12
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: instala exatamente o lockfile (determinístico, sai do npm install).
      - name: Instala dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build
